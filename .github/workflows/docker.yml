name: Docker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION=0.3.0 \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg SOURCE_URL=${{ github.server_url }}/${{ github.repository }} \
            -t demandpulse-api:${{ github.sha }} .

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start API + MLflow
        env:
          APP_VERSION: ${{ github.sha }}
          GIT_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: docker compose up -d

      - name: Wait for services and smoke test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          import urllib.request

          endpoints = [
              "http://127.0.0.1:8000/health",
              "http://127.0.0.1:8000/docs",
              "http://127.0.0.1:5000/",
          ]
          for url in endpoints:
              for _ in range(60):
                  try:
                      with urllib.request.urlopen(url, timeout=3) as response:
                          if response.status == 200:
                              break
                  except Exception:
                      time.sleep(2)
              else:
                  raise SystemExit(f"Smoke test failed: {url}")
          PY
          docker compose ps

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans
